<script>
/* Offline shell: cache the app so pass-and-play works with no connection.
 * Guarded — plain http(s) only, so the Capacitor wrapper and file:// are unaffected. */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* offline is best-effort */ });
  });
}
</script>
